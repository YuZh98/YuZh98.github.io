<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F3A5F"/>
    </marker>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="798" height="428" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>

  <!-- laptop -->
  <rect x="40" y="36" width="150" height="60" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="115" y="63" text-anchor="middle" font-size="16" font-weight="600" fill="#374151">Your laptop</text>
  <text x="115" y="83" text-anchor="middle" font-size="12" fill="#6B7280">editor, terminal</text>
  <line x1="190" y1="66" x2="256" y2="66" stroke="#6B7280" stroke-width="2.2" marker-end="url(#a-gray)"/>
  <text x="223" y="56" text-anchor="middle" font-size="13" fill="#6B7280">ssh</text>

  <!-- login node -->
  <rect x="260" y="28" width="260" height="76" rx="8" fill="#E8EDF4" stroke="#1F3A5F" stroke-width="2.2"/>
  <text x="390" y="60" text-anchor="middle" font-size="17" font-weight="700" fill="#1F3A5F">Login node</text>
  <text x="390" y="82" text-anchor="middle" font-size="12.5" fill="#1F3A5F">edit · move files · submit · monitor</text>
  <text x="390" y="97" text-anchor="middle" font-size="11" font-style="italic" fill="#1F3A5F">shared by everyone, no heavy computing</text>

  <!-- slurm fan-out -->
  <line x1="390" y1="104" x2="390" y2="136" stroke="#1F3A5F" stroke-width="2.2"/>
  <line x1="250" y1="136" x2="630" y2="136" stroke="#1F3A5F" stroke-width="2.2"/>
  <line x1="250" y1="136" x2="250" y2="176" stroke="#1F3A5F" stroke-width="2.2" marker-end="url(#a-navy)"/>
  <line x1="630" y1="136" x2="630" y2="176" stroke="#1F3A5F" stroke-width="2.2" marker-end="url(#a-navy)"/>
  <rect x="404" y="112" width="210" height="20" rx="4" fill="#FFFFFF"/>
  <text x="408" y="127" font-size="12.5" fill="#1F3A5F">Slurm hands out cores, memory, time</text>

  <!-- CPU nodes -->
  <rect x="40" y="180" width="420" height="96" rx="10" fill="#F0FAF8" stroke="#0F766E" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="56" y="200" font-size="13.5" font-weight="700" fill="#0F766E">Compute nodes (CPU only)</text>
  <g font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0F766E" text-anchor="middle">
    <rect x="60" y="212" width="64" height="40" rx="6" fill="#CCECE7" stroke="#0F766E" stroke-width="1.5"/><text x="92" y="237">c01</text>
    <rect x="136" y="212" width="64" height="40" rx="6" fill="#CCECE7" stroke="#0F766E" stroke-width="1.5"/><text x="168" y="237">c02</text>
    <rect x="212" y="212" width="64" height="40" rx="6" fill="#CCECE7" stroke="#0F766E" stroke-width="1.5"/><text x="244" y="237">c03</text>
    <text x="316" y="237" font-size="18">…</text>
    <rect x="356" y="212" width="64" height="40" rx="6" fill="#CCECE7" stroke="#0F766E" stroke-width="1.5"/><text x="388" y="237">c10</text>
  </g>
  <text x="250" y="268" text-anchor="middle" font-size="11.5" fill="#0F766E">each: own CPUs, own RAM, own local NVMe /tmp</text>

  <!-- GPU nodes -->
  <rect x="500" y="180" width="260" height="96" rx="10" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="516" y="200" font-size="13.5" font-weight="700" fill="#6D28D9">Compute nodes + GPUs</text>
  <g font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#6D28D9" text-anchor="middle">
    <rect x="530" y="212" width="90" height="40" rx="6" fill="#E4DCFB" stroke="#6D28D9" stroke-width="1.5"/><text x="560" y="237">g01</text>
    <rect x="640" y="212" width="90" height="40" rx="6" fill="#E4DCFB" stroke="#6D28D9" stroke-width="1.5"/><text x="670" y="237">g02</text>
  </g>
  <g fill="#6D28D9">
    <rect x="588" y="219" width="8" height="26" rx="1.5"/><rect x="600" y="219" width="8" height="26" rx="1.5"/>
    <rect x="698" y="219" width="8" height="26" rx="1.5"/><rect x="710" y="219" width="8" height="26" rx="1.5"/>
  </g>
  <text x="630" y="268" text-anchor="middle" font-size="11.5" fill="#6D28D9">same CPUs, plus several GPU cards</text>

  <!-- storage -->
  <line x1="250" y1="276" x2="250" y2="340" stroke="#B45309" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="630" y1="276" x2="630" y2="340" stroke="#B45309" stroke-width="2" stroke-dasharray="5 4"/>
  <polyline points="520,66 776,66 776,372 680,372" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="160" y="340" width="520" height="64" rx="10" fill="#FEF3E2" stroke="#B45309" stroke-width="2.2"/>
  <text x="420" y="366" text-anchor="middle" font-size="16" font-weight="700" fill="#B45309">Shared storage server (NFS)</text>
  <text x="420" y="388" text-anchor="middle" font-size="12.5" fill="#B45309">/home · /scratch · /project — the same files, mounted on every node</text>
</svg>
